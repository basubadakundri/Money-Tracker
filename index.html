<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger – Budget & Cloud Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">

<!-- Firebase Libraries (Compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg: rgba(255, 255, 255, .38);
  --sf: rgba(255, 255, 255, .52);
  --sf2: rgba(255, 255, 255, .82);
  --ink: #17152b;
  --mu: #55537a;
  --ln: rgba(255, 255, 255, .7);
  --b0: #e8edfc;
  --sh: 0 10px 34px rgba(60, 50, 140, .18);
  --ac: #5b45e0;
  --acs: rgba(91, 69, 224, .15);
  --acf: #fff;
  --hero: #3b2fb8;
  --in: #0f9d76;
  --ins: rgba(15, 157, 118, .16);
  --ex: #e5484d;
  --exs: rgba(229, 72, 77, .14);
  --wa: #e08f00;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: rgba(255, 255, 255, .07);
    --sf: rgba(255, 255, 255, .08);
    --sf2: rgba(28, 26, 58, .85);
    --ink: #f1f0ff;
    --mu: #aaa8cb;
    --ln: rgba(255, 255, 255, .16);
    --b0: #090919;
    --sh: 0 10px 34px rgba(0, 0, 0, .45);
    --ac: #8b7cff;
    --acs: rgba(139, 124, 255, .22);
    --acf: #12102a;
    --hero: #3a2fa0;
    --in: #3fd0a4;
    --ins: rgba(63, 208, 164, .16);
    --ex: #ff7a7f;
    --exs: rgba(255, 122, 127, .16);
    --wa: #ffc24d;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: rgba(255, 255, 255, .07);
  --sf: rgba(255, 255, 255, .08);
  --sf2: rgba(28, 26, 58, .85);
  --ink: #f1f0ff;
  --mu: #aaa8cb;
  --ln: rgba(255, 255, 255, .16);
  --b0: #090919;
  --sh: 0 10px 34px rgba(0, 0, 0, .45);
  --ac: #8b7cff;
  --acs: rgba(139, 124, 255, .22);
  --acf: #12102a;
  --hero: #3a2fa0;
  --in: #3fd0a4;
  --ins: rgba(63, 208, 164, .16);
  --ex: #ff7a7f;
  --exs: rgba(255, 122, 127, .16);
  --wa: #ffc24d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--b0);
  color: var(--ink);
  font: 400 15px/1.5 Figtree, system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }

/* Background Animated Gradient Orbs */
.orbs { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
.orbs i {
  position: absolute;
  border-radius: 50%;
  filter: blur(36px);
  opacity: .75;
  will-change: transform;
  animation: drift 24s ease-in-out infinite alternate;
}
.orbs i:nth-child(1) { width: 48vmax; height: 48vmax; left: -14vmax; top: -16vmax; background: #7b61ff; }
.orbs i:nth-child(2) { width: 40vmax; height: 40vmax; right: -12vmax; top: 4vh; background: #19b8ff; animation-duration: 28s; animation-delay: -9s; }
.orbs i:nth-child(3) { width: 44vmax; height: 44vmax; left: 28vw; bottom: -24vmax; background: #ff5fb0; animation-duration: 32s; animation-delay: -15s; }
.orbs i:nth-child(4) { width: 24vmax; height: 24vmax; left: 6vw; top: 55vh; background: #ffb347; opacity: .55; animation-duration: 20s; animation-delay: -4s; }
@keyframes drift { to { transform: translate(9vmax, 6vmax) scale(1.15); } }
:root[data-theme=dark] .orbs i { opacity: .35; }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) .orbs i { opacity: .35; } }

/* App Layout & Frosted Glass Elements */
.app { display: grid; grid-template-columns: 240px 1fr; }
nav {
  padding: 22px 14px;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  height: 100vh;
}
@media (min-width: 821px) {
  #nav {
    margin: 16px 0 0 16px;
    border-radius: 30px;
    height: calc(100vh - 32px);
  }
}

.card, .mn, .sheet, #nav {
  backdrop-filter: blur(20px) saturate(200%) brightness(1.05);
  -webkit-backdrop-filter: blur(20px) saturate(200%) brightness(1.05);
  box-shadow: 0 14px 40px rgba(30, 20, 90, .14), 0 2px 6px rgba(30, 20, 90, .06), inset 0 1.5px 0 rgba(255, 255, 255, .7);
  background: linear-gradient(160deg, var(--sf), var(--bg));
  position: relative;
  overflow: hidden;
}

.card { border-radius: 28px; padding: 20px; margin-bottom: 16px; }
.sheet { border-radius: 32px; background: var(--sf2); max-width: 440px; width: 100%; padding: 24px; max-height: 90vh; overflow: auto; }
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(520px circle at var(--mx, 18%) var(--my, 0%), rgba(255, 255, 255, .25), transparent 46%);
  pointer-events: none;
}

.logo { font-weight: 800; font-size: 1.35rem; letter-spacing: -.03em; padding: 0 10px 18px; display: flex; align-items: center; gap: 8px; }
.logo span { background: var(--ac); color: #fff; font-size: .85rem; padding: 2px 8px; border-radius: 8px; }
nav button {
  display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: none;
  padding: 12px 14px; border-radius: 99px; color: var(--mu); font-weight: 600; text-align: left;
  transition: transform .2s cubic-bezier(.3,1.7,.5,1), background .2s;
}
nav button[aria-current=page] {
  background: var(--acs);
  color: var(--ac);
  box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .9), 0 6px 16px rgba(60, 40, 160, .18);
}

main { padding: 24px 32px 40px; max-width: 1060px; width: 100%; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.hr { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.75rem; letter-spacing: -.03em; font-weight: 800; }
h2 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 700; }

.mn { display: flex; align-items: center; border-radius: 99px; padding: 4px; }
.mn button { border: 0; background: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1.2rem; }
.mn span { min-width: 128px; text-align: center; font-weight: 600; }

.btn {
  background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 75%, #fff), var(--ac));
  color: var(--acf); border: 0; border-radius: 99px; padding: 10px 22px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  box-shadow: 0 8px 22px color-mix(in srgb, var(--ac) 42%, transparent), inset 0 1.5px 0 rgba(255, 255, 255, .65);
  transition: transform .2s cubic-bezier(.3,1.7,.5,1), box-shadow .2s;
}
.btn.ghost { background: var(--bg); color: var(--ink); box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .6); }
.btn:active { transform: scale(.96); }

.chip {
  background: var(--acs); color: var(--ac); border: 0; border-radius: 99px; padding: 7px 16px;
  font-weight: 600; font-size: .85rem; display: inline-flex; align-items: center; gap: 6px;
  box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .7), 0 2px 8px rgba(40, 30, 120, .1);
}
.chip.dg { background: var(--exs); color: var(--ex); }

.hero {
  border-radius: 32px; padding: 26px; margin-bottom: 16px; color: #fff;
  background: linear-gradient(135deg, color-mix(in srgb, #5b3fe6 92%, transparent), color-mix(in srgb, #0b86d6 82%, transparent) 55%, color-mix(in srgb, #d6409a 84%, transparent));
  box-shadow: 0 18px 44px rgba(70, 50, 200, .35), inset 0 1.5px 0 rgba(255, 255, 255, .8);
  position: relative; overflow: hidden;
}
.hero small { opacity: .82; font-weight: 500; }
.hb { font-size: clamp(2.3rem, 7vw, 3.4rem); font-weight: 800; letter-spacing: -.035em; line-height: 1.1; margin: 4px 0 16px; }
.hs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.hs div {
  background: rgba(255, 255, 255, .18); border-radius: 20px; padding: 12px; font-size: .84rem;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .4);
}
.hs b { display: block; font-size: 1.1rem; }

.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.g3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.g2 > .card, .g3 > .card { margin: 0; }

.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid color-mix(in srgb, var(--ink) 9%, transparent); }
.li:first-of-type { border-top: 0; }
.ic { flex: none; width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; font-size: 1.2rem; box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .7); }
.ic.income { background: var(--ins); } .ic.expense { background: var(--exs); }
.mt { flex: 1; min-width: 0; } .mt b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
small, .mu { color: var(--mu); font-size: .84rem; }
.am { font-weight: 700; white-space: nowrap; } .am.income { color: var(--in); } .am.expense { color: var(--ex); }
.ib { border: 0; background: none; color: var(--mu); padding: 6px 8px; border-radius: 8px; }
.ib:hover { background: var(--bg); }

.tr { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.12); }
.fl { height: 100%; border-radius: 99px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.bt { padding: 6px 0; } .bt .li { padding-bottom: 8px; } .st { display: block; margin-top: 4px; }

.lg { display: flex; align-items: center; gap: 8px; font-size: .88rem; padding: 3px 0; }
.lg i { width: 10px; height: 10px; border-radius: 3px; } .lg b { margin-left: auto; }
.dn { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.dn svg { width: 150px; flex: none; } .dn div { flex: 1; min-width: 140px; }
svg text { fill: var(--mu); font-size: 9px; font-family: inherit; }

.tb { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tb input { flex: 2 1 160px; } .tb select { flex: 1 1 110px; }
input, select, textarea {
  background: var(--bg); border: 1px solid var(--ln); border-radius: 16px; padding: 11px 14px;
  width: 100%; box-shadow: inset 0 1px 3px rgba(0,0,0,.1);
}
label { display: block; font-size: .85rem; color: var(--mu); margin-top: 12px; }
label input, label select { margin-top: 5px; color: var(--ink); }
label.ck { display: flex; gap: 8px; align-items: center; } label.ck input { width: auto; margin: 0; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 99px; padding: 4px; }
.seg button { border: 0; background: none; padding: 9px; border-radius: 99px; font-weight: 600; color: var(--mu); }
.seg button[aria-pressed="true"] { background: var(--acs); color: var(--ac); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.8), 0 4px 12px rgba(40,30,120,.16); }

.row { display: flex; gap: 8px; margin-top: 16px; }
.row.wrap { flex-wrap: wrap; } .row .btn { flex: 1; }
.err { color: var(--ex); font-size: .85rem; min-height: 1.2em; margin: 8px 0 0; }
.empty { text-align: center; color: var(--mu); padding: 28px 12px; }
.big2 { font-size: 1.5rem; font-weight: 800; margin: 12px 0 8px; letter-spacing: -.02em; } .big2 small { font-weight: 500; }

#m { position: fixed; inset: 0; background: rgba(18,14,48,.42); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
#m[hidden] { display: none; }
textarea { min-height: 140px; font: 12px/1.4 ui-monospace, Menlo, monospace; }

/* Status Badges & Animations */
.bdg { font-size: .72rem; font-weight: 700; border-radius: 99px; padding: 2px 8px; background: var(--exs); color: var(--ex); }
.bdg.ok { background: var(--ins); color: var(--in); }
.sm3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.sm3 div { background: var(--bg); border-radius: 16px; padding: 10px 12px; font-size: .82rem; }
.sm3 b { display: block; font-size: 1.05rem; }

#toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom,0px));
  transform: translate(-50%, 20px); background: var(--sf2); color: var(--ink);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  padding: 10px 20px; border-radius: 99px; font-weight: 600; opacity: 0;
  pointer-events: none; transition: .3s; z-index: 30; white-space: nowrap;
  box-shadow: 0 10px 30px rgba(30,20,90,.25), inset 0 1.5px 0 rgba(255,255,255,.7);
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

.sync-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #9a98b8; vertical-align: middle; margin-right: 4px; }
.sync-dot.on { background: var(--in); box-shadow: 0 0 8px var(--in); }
.sync-dot.syncing { background: var(--wa); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.user-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--bg); border-radius: 16px; margin-bottom: 14px; }
.user-card img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--sf); }

.cf { position: fixed; top: -14px; width: 8px; height: 12px; z-index: 40; pointer-events: none; animation: fall 1.7s ease-in forwards; }
@keyframes fall { to { transform: translateY(106vh) rotate(540deg); } }

@media (max-width: 820px) {
  .app { display: block; }
  nav {
    position: fixed; top: auto; bottom: calc(10px + env(safe-area-inset-bottom,0px));
    left: 12px; right: 12px; z-index: 5; display: flex; padding: 6px 4px;
    background: var(--sf2); border-radius: 32px; height: auto;
  }
  .logo { display: none; }
  nav button { flex-direction: column; gap: 0; font-size: .7rem; padding: 6px 2px; align-items: center; text-align: center; }
  main { padding: 16px 14px 100px; }
  .g2 { grid-template-columns: 1fr; }
  #m { align-items: flex-end; padding: 0; }
  .sheet { border-radius: 28px 28px 0 0; max-width: none; padding-bottom: calc(24px + env(safe-area-inset-bottom,0px)); }
}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="app">
<nav id="nav">
  <div class="logo">Ledger <span>₹</span></div>
  <button data-v="overview"><i>◔</i>Overview</button>
  <button data-v="tx"><i>⇅</i>Activity</button>
  <button data-v="budgets"><i>◎</i>Budgets</button>
  <button data-v="goals"><i>⚑</i>Goals</button>
  <button data-v="debts"><i>⇄</i>Debts</button>
  <button data-v="set"><i>⚙</i>Settings</button>
</nav>
<main id="main"></main>
</div>
<div id="m" hidden></div>
<div id="toast" role="status"></div>

<script>
// ==================== FIREBASE CONFIGURATION ====================
const firebaseConfig = {
  apiKey: "AIzaSyCAeTJvQSeD69WsBPTgY5OawhwpOew-fIU",
  authDomain: "money-tracker-2061e.firebaseapp.com",
  projectId: "money-tracker-2061e",
  storageBucket: "money-tracker-2061e.firebasestorage.app",
  messagingSenderId: "81116364692",
  appId: "1:81116364692:web:ccbbcb900b47ec652d5981"
};

let auth = null, db = null, currentUser = null, unsubSnapshot = null;
let syncStatus = "offline";

try {
  if (firebaseConfig.apiKey) {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(function(){});
  }
} catch(err) {
  console.warn("Firebase initialization warning:", err);
}

// ==================== APP ENGINE ====================
(function(){
var KEY = "ledger.pro.v1";
var CATS = {
  expense: { Housing:"🏠", Food:"🍽️", Transport:"🚗", Bills:"💡", Shopping:"🛍️", Health:"💊", Fun:"🎬", Travel:"✈️", Interest:"🏦", Other:"📦" },
  income: { Salary:"💼", Freelance:"💻", Investments:"📈", Gift:"🎁", Other:"💰" }
};
var COL = ["#5b45e0","#0f9d76","#e5484d","#f5a524","#0ea5e9","#d946ef","#84cc16","#f97316","#64748b"];
var LOC = { INR:"en-IN", USD:"en-US", EUR:"de-DE", GBP:"en-GB" };

var S = { tx:[], budgets:{}, goals:[], rules:[], debts:[], cur:"INR", theme:"" };

try { Object.assign(S, JSON.parse(localStorage.getItem(KEY))); } catch(x){}

var $ = function(s){ return document.querySelector(s); };
var p = function(n){ return String(n).padStart(2,"0"); };
var uid = function(){ return Date.now() + Math.floor(Math.random()*1e4); };
var e = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var ym = function(d){ return d.getFullYear()+"-"+p(d.getMonth()+1); };
var td = function(){ var d=new Date(); return ym(d)+"-"+p(d.getDate()); };
var addM = function(m,n){ var a=m.split("-"); return ym(new Date(+a[0],+a[1]-1+n,1)); };
var ML = function(m,s){ var a=m.split("-"); return new Date(+a[0],+a[1]-1,1).toLocaleString("en",s?{month:"short"}:{month:"long",year:"numeric"}); };
var fd = function(d){ return new Date(d+"T00:00").toLocaleDateString("en",{day:"numeric",month:"short"}); };

var nf, V = { view:"overview", month:ym(new Date()), q:"", ft:"all", fc:"all" };
function mk(){ nf = new Intl.NumberFormat(LOC[S.cur]||"en-IN",{ style:"currency", currency:S.cur, minimumFractionDigits:0, maximumFractionDigits:2 }); }
var $m = function(n){ return nf.format(n); };
var icon = function(t,c){ return CATS[t][c]||"📦"; };

// Save to LocalStorage + Cloud Firestore Sync
var cloudSaveTimer = null;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(x){}
  
  if (currentUser && db) {
    syncStatus = "syncing";
    updateSyncBadge();
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(function(){
      db.collection("users").doc(currentUser.uid).set({
        state: S,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true })
      .then(function(){
        syncStatus = "synced";
        updateSyncBadge();
      })
      .catch(function(err){
        console.error("Cloud save failed:", err);
        syncStatus = "offline";
        updateSyncBadge();
      });
    }, 500);
  }
}

function persist(msg){ save(); render(); if(msg) toast(msg); }
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute("data-theme",S.theme);
  else document.documentElement.removeAttribute("data-theme");
}

function updateSyncBadge(){
  var el = $("#sync-indicator");
  if(!el) return;
  if(!currentUser){
    el.innerHTML = '<span class="sync-dot"></span> Local only';
  } else if(syncStatus === "syncing"){
    el.innerHTML = '<span class="sync-dot syncing"></span> Syncing...';
  } else if(syncStatus === "synced"){
    el.innerHTML = '<span class="sync-dot on"></span> Cloud synced';
  } else {
    el.innerHTML = '<span class="sync-dot"></span> Offline';
  }
}

var inM = function(m){ return S.tx.filter(function(x){ return x.date.slice(0,7)===m; }); };
var sum = function(a,t){ return a.filter(function(x){ return x.type===t; }).reduce(function(s,x){ return s+x.amt; },0); };
function spentBy(m){ var o={}; inM(m).forEach(function(x){ if(x.type==="expense") o[x.cat]=(o[x.cat]||0)+x.amt; }); return o; }

function gen(){
  var t = td();
  S.rules.forEach(function(r){
    for(;;){
      var m = addM(r.gen,1), d = m+"-"+p(Math.min(r.day,28));
      if(d > t) break;
      S.tx.push({ id:uid()+S.tx.length, type:r.type, amt:r.amt, cat:r.cat, note:r.note, date:d, rid:r.id });
      r.gen = m;
    }
  });
}

function txRow(x,act){
  return '<div class="li"><span class="ic '+x.type+'">'+icon(x.type,x.cat)+'</span><div class="mt"><b>'+e(x.note||x.cat)+'</b><small>'+e(x.cat)+' · '+fd(x.date)+(x.rid?' · repeats':'')+'</small></div><span class="am '+x.type+'">'+(x.type==="income"?"+":"−")+$m(x.amt)+'</span>'+(act?'<button class="ib" data-act="edit" data-id="'+x.id+'" aria-label="Edit">✎</button><button class="ib" data-act="del" data-id="'+x.id+'" aria-label="Delete">✕</button>':'')+'</div>';
}

function bRow(c,l,s){
  var pc = l ? s/l : 0, col = pc>=1 ? "var(--ex)" : pc>=.8 ? "var(--wa)" : "var(--in)";
  return '<div class="bt"><div class="li"><span class="ic expense">'+icon("expense",c)+'</span><div class="mt"><b>'+c+'</b><small>'+(l?$m(s)+' of '+$m(l):$m(s)+' spent · no limit')+'</small></div><button class="chip" data-act="blim" data-c="'+c+'">'+(l?"Edit":"Set limit")+'</button></div>'+(l?'<div class="tr"><div class="fl" style="width:'+Math.min(100,pc*100)+'%;background:'+col+'"></div></div><small class="st" style="color:'+col+'">'+(pc>=1?'Over by '+$m(s-l):$m(l-s)+' left')+'</small>':'')+'</div>';
}

// ==================== VIEWS ====================
function vOv(){
  var a = inM(V.month), inc = sum(a,"income"), ex = sum(a,"expense"), sp = spentBy(V.month);
  var cs = Object.keys(sp).sort(function(x,y){ return sp[y]-sp[x]; });
  var rate = inc ? Math.round((inc-ex)/inc*100) : 0, C = 2*Math.PI*40, off = 0;
  var segs = cs.map(function(c,i){
    var l = sp[c]/ex*C, s = '<circle r="40" cx="60" cy="60" fill="none" stroke="'+COL[i%9]+'" stroke-width="16" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-off)+'" data-act="slice" data-c="'+c+'"><title>'+c+': '+$m(sp[c])+'</title></circle>';
    off += l; return s;
  }).join("");
  var lg = cs.slice(0,6).map(function(c,i){ return '<div class="lg" data-act="slice" data-c="'+c+'"><i style="background:'+COL[i%9]+'"></i>'+c+'<b>'+$m(sp[c])+'</b></div>'; }).join("");
  var ms = [0,1,2,3,4,5].map(function(i){ return addM(V.month,i-5); }), d = ms.map(function(m){ var t=inM(m); return[sum(t,"income"),sum(t,"expense")]; });
  var mx = Math.max.apply(null,[1].concat([].concat.apply([],d)));
  var bars = ms.map(function(m,i){
    var x = i*48+10, h1 = d[i][0]/mx*88, h2 = d[i][1]/mx*88;
    return '<rect x="'+x+'" y="'+(100-h1)+'" width="14" height="'+h1+'" rx="3" fill="var(--in)"><title>Income '+$m(d[i][0])+'</title></rect><rect x="'+(x+17)+'" y="'+(100-h2)+'" width="14" height="'+h2+'" rx="3" fill="var(--ex)"><title>Expenses '+$m(d[i][1])+'</title></rect><text x="'+(x+16)+'" y="114" text-anchor="middle">'+ML(m,1)+'</text>';
  }).join("");
  var bl = Object.keys(S.budgets).filter(function(c){ return S.budgets[c]>0; }).sort(function(x,y){ return(sp[y]||0)/S.budgets[y]-(sp[x]||0)/S.budgets[x]; }).slice(0,4);
  var rec = a.sort(function(x,y){ return y.date.localeCompare(x.date)||y.id-x.id; }).slice(0,5);

  return (S.tx.length ? '' : '<div class="card empty">Welcome to Ledger. Add your first transaction above or sign in to sync.</div>') +
  '<div class="hero"><small>Balance for '+ML(V.month)+'</small><div class="hb" data-n="'+(inc-ex)+'">'+$m(inc-ex)+'</div><div class="hs"><div>Income<b data-n="'+inc+'">'+$m(inc)+'</b></div><div>Expenses<b data-n="'+ex+'">'+$m(ex)+'</b></div><div>Savings rate<b>'+rate+'%</b></div></div></div>'+insCard(inc,ex,sp,rate)+
  '<div class="g2"><div class="card"><h2>Spending by category</h2>'+(ex?'<div class="dn"><svg viewBox="0 0 120 120"><g transform="rotate(-90 60 60)">'+segs+'</g><text x="60" y="58" text-anchor="middle">Spent</text><text x="60" y="70" text-anchor="middle" style="fill:var(--ink);font-weight:700;font-size:10px">'+$m(ex)+'</text></svg><div>'+lg+'</div></div>':'<p class="empty">No expenses this month.</p>')+'</div>'+
  '<div class="card"><h2>Last 6 months</h2><svg viewBox="0 0 300 120"><line x1="0" x2="300" y1="100" y2="100" stroke="var(--ln)"/>'+bars+'</svg><div class="lg" style="gap:14px"><span><i style="display:inline-block;background:var(--in);width:10px;height:10px;border-radius:3px"></i> Income</span><span><i style="display:inline-block;background:var(--ex);width:10px;height:10px;border-radius:3px"></i> Expenses</span></div></div></div>'+
  '<div class="g2"><div class="card"><h2>Budget watch</h2>'+(bl.length?bl.map(function(c){ return bRow(c,S.budgets[c],sp[c]||0); }).join(""):'<p class="empty">Set monthly limits in Budgets to see progress here.</p>')+'</div>'+
  '<div class="card"><h2>Recent activity</h2>'+(rec.length?rec.map(function(x){ return txRow(x); }).join(""):'<p class="empty">Nothing this month yet.</p>')+'</div></div>';
}

function txList(){
  var q = V.q.toLowerCase(), a = inM(V.month).filter(function(x){ return(V.ft==="all"||x.type===V.ft)&&(V.fc==="all"||x.cat===V.fc)&&(!q||(x.note+" "+x.cat).toLowerCase().indexOf(q)>-1); }).sort(function(x,y){ return y.date.localeCompare(x.date)||y.id-x.id; });
  var g = "", o = "";
  a.forEach(function(x){ var l = dl(x.date); if(l!==g){ g=l; o+='<div class="gh">'+l+'</div>'; } o += txRow(x,1); });
  return o || '<p class="empty">No transactions found for this month.</p>';
}

function vTx(){
  var all = Object.keys(CATS.expense).concat(Object.keys(CATS.income).filter(function(c){ return !CATS.expense[c]; }));
  return '<div class="card"><div class="tb"><input id="q" type="search" placeholder="Search transactions" value="'+e(V.q)+'" aria-label="Search"><select id="ft" aria-label="Type">'+[["all","All types"],["income","Income"],["expense","Expenses"]].map(function(o){ return'<option value="'+o[0]+'"'+(V.ft===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("")+'</select><select id="fc" aria-label="Category"><option value="all">All categories</option>'+all.map(function(c){ return'<option'+(V.fc===c?" selected":"")+'>'+c+'</option>'; }).join("")+'</select></div><div id="txl">'+txList()+'</div></div>'+
  (S.rules.length?'<div class="card"><h2>Recurring</h2>'+S.rules.map(function(r){ return'<div class="li"><span class="ic '+r.type+'">'+icon(r.type,r.cat)+'</span><div class="mt"><b>'+e(r.note||r.cat)+'</b><small>Monthly on day '+r.day+'</small></div><span class="am '+r.type+'">'+$m(r.amt)+'</span><button class="ib" data-act="delr" data-id="'+r.id+'" aria-label="Stop repeating">✕</button></div>'; }).join("")+'</div>':'');
}

function vBu(){
  var sp = spentBy(V.month), tl = 0, ts = 0, rows = Object.keys(CATS.expense).map(function(c){ var l = S.budgets[c]||0, s = sp[c]||0; if(l){ tl+=l; ts+=s; } return bRow(c,l,s); }).join("");
  return '<div class="card"><small>Total budgeted for '+ML(V.month)+'</small><div class="big2">'+(tl?$m(ts)+' <small>of '+$m(tl)+' spent</small>':'No limits yet')+'</div>'+(tl?'<div class="tr"><div class="fl" style="width:'+Math.min(100,ts/tl*100)+'%;background:'+(ts>tl?"var(--ex)":"var(--ac)")+'"></div></div>':'<small>Set a limit on any category below. Limits repeat every month.</small>')+'</div><div class="card">'+rows+'</div>';
}

function vGo(){
  return S.goals.length ? '<div class="g3">'+S.goals.map(function(g){
    var pc = Math.min(100, g.saved/g.target*100);
    return '<div class="card"><div class="li" style="border:0;padding:0"><span class="ic income">🎯</span><div class="mt"><b>'+e(g.name)+'</b><small>'+Math.round(pc)+'% reached</small></div><button class="ib" data-act="gedit" data-id="'+g.id+'" aria-label="Edit goal">✎</button><button class="ib" data-act="gdel" data-id="'+g.id+'" aria-label="Delete goal">✕</button></div><div class="big2">'+$m(g.saved)+' <small>of '+$m(g.target)+'</small></div><div class="tr"><div class="fl" style="width:'+pc+'%;background:var(--ac)"></div></div><div class="row"><button class="chip" data-act="gfund" data-id="'+g.id+'">+ Add funds</button></div></div>';
  }).join("")+'</div>' : '<div class="card empty">Save for something specific, like an emergency fund or gadgets.<br><button class="btn" style="margin-top:12px" data-act="gnew">Create a goal</button></div>';
}

function rem(d){ return Math.max(0, d.amt - d.paid); }
function vDe(){
  var ds = S.debts, t = td(), ow = 0, lt = 0;
  ds.forEach(function(d){ if(d.kind==="owe") ow += rem(d); else lt += rem(d); });
  var card = function(d){
    var r = rem(d), pc = Math.min(100, d.paid/d.amt*100), od = d.due && r>0 && d.due<t, own = d.kind==="owe";
    return '<div class="card"><div class="li" style="border:0;padding:0"><span class="ic '+(own?"expense":"income")+'">'+(own?"🏦":"🤝")+'</span><div class="mt"><b>'+e(d.who)+'</b><small>'+(own?"You owe":"Owes you")+(d.rate?" · "+d.rate+"% a year":"")+(d.emi?" · EMI "+$m(d.emi):"")+'</small></div>'+(r<=0?'<span class="bdg ok">Settled</span>':od?'<span class="bdg">Overdue</span>':"")+'<button class="ib" data-act="dedit" data-id="'+d.id+'" aria-label="Edit">✎</button><button class="ib" data-act="ddel" data-id="'+d.id+'" aria-label="Delete">✕</button></div><div class="big2">'+$m(r)+' <small>left of '+$m(d.amt)+'</small></div><div class="tr"><div class="fl" style="width:'+pc+'%;background:'+(own?"var(--ac)":"var(--in)")+'"></div></div><small class="st">'+(d.due&&r>0?"Next due "+fd(d.due)+" · ":"")+d.pays.length+(d.pays.length===1?" payment":" payments")+(d.note?" · "+e(d.note):"")+'</small>'+(r>0?'<div class="row"><button class="chip" data-act="dpay" data-id="'+d.id+'">'+(own?"Record payment":"Record repayment")+'</button></div>':"")+'</div>';
  };
  var sec = function(k,h){ var a = ds.filter(function(d){ return d.kind===k; }); return a.length ? '<h2>'+h+'</h2><div class="g3" style="margin-bottom:18px">'+a.map(card).join("")+'</div>' : ""; };

  return '<div class="card"><div class="sm3"><div>You owe<b style="color:var(--ex)">'+$m(ow)+'</b></div><div>Owed to you<b style="color:var(--in)">'+$m(lt)+'</b></div><div>Net<b>'+$m(lt-ow)+'</b></div></div><p class="mu" style="margin:10px 0 0">Loans and lending are strictly tracked here, separate from ordinary expenses.</p></div>'+
  (ds.length ? sec("owe","Loans and money you owe")+sec("lent","Money you lent") : '<div class="card empty">Track personal loans, udhaar or credit card balances.<br><button class="btn" style="margin-top:12px" data-act="dnew">Add your first entry</button></div>');
}

function vSe(){
  var authHtml = '';
  if (!auth) {
    authHtml = '<p class="err">Firebase is not configured yet.</p>';
  } else if (currentUser) {
    authHtml = '<div class="user-card">'+
      (currentUser.photoURL ? '<img src="'+currentUser.photoURL+'" alt="Avatar">' : '<div class="ic income">👤</div>')+
      '<div style="flex:1;min-width:0"><b>'+e(currentUser.displayName||"User")+'</b><small>'+e(currentUser.email)+'</small></div>'+
      '<button class="chip dg" data-act="logout">Sign out</button>'+
    '</div><p class="mu">Your data is synced automatically across all your devices.</p>';
  } else {
    authHtml = '<p class="mu">Sign in with Google to sync your transactions across devices.</p>'+
      '<div class="row"><button class="btn" data-act="login">Sign in with Google</button></div>';
  }

  return '<div class="card"><h2>Account & Cloud Sync</h2>'+authHtml+'</div>'+
  '<div class="card"><h2>Preferences</h2><label>Currency<select id="cur">'+Object.keys(LOC).map(function(c){ return'<option'+(c===S.cur?" selected":"")+'>'+c+'</option>'; }).join("")+'</select></label><div class="row"><button class="chip" data-act="theme">Toggle light / dark theme</button></div></div>'+
  '<div class="card"><h2>Backup & Offline Storage</h2><p class="mu">Export an offline JSON file anytime or restore from a past backup.</p><div class="row wrap"><button class="chip" data-act="export">Export backup</button><button class="chip" data-act="import">Import backup</button><button class="chip dg" data-act="reset">Reset all data</button></div></div>';
}

// ==================== AUTH & SYNC ENGINE ====================
function initAuth(){
  if (!auth) return;
  auth.onAuthStateChanged(function(user){
    currentUser = user;
    if (user) {
      toast("Signed in as " + (user.displayName || user.email));
      syncStatus = "syncing";
      updateSyncBadge();

      if (unsubSnapshot) unsubSnapshot();
      unsubSnapshot = db.collection("users").doc(user.uid).onSnapshot(function(doc){
        if (doc.exists && doc.data().state) {
          S = Object.assign({ tx:[], budgets:{}, goals:[], rules:[], debts:[], cur:"INR", theme:"" }, doc.data().state);
          try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(x){}
          mk();
          applyTheme();
          render();
        } else {
          save();
        }
        syncStatus = "synced";
        updateSyncBadge();
      }, function(err){
        console.error("Firestore sync error:", err);
        syncStatus = "offline";
        updateSyncBadge();
      });

    } else {
      if (unsubSnapshot) { unsubSnapshot(); unsubSnapshot = null; }
      syncStatus = "offline";
      updateSyncBadge();
      render();
    }
  });
}

function loginGoogle(){
  if (!auth) return;
  var provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(function(err){
    console.error("Login failed:", err);
    alert("Sign-in error: " + err.message);
  });
}

function logoutGoogle(){
  if (!auth) return;
  auth.signOut().then(function(){
    toast("Signed out");
    render();
  });
}

// ==================== HELPERS & MODALS ====================
function toast(t){
  var el = $("#toast"); el.textContent = t; el.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(function(){ el.classList.remove("on"); }, 1900);
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(var i=0; i<40; i++){
    var c = document.createElement("i");
    c.className = "cf";
    c.style.cssText = "left:"+Math.random()*100+"vw;background:"+COL[i%9]+";animation-delay:"+Math.random()*.4+"s";
    document.body.appendChild(c);
    setTimeout(c.remove.bind(c), 2300);
  }
}

function dl(d){
  var y = new Date(); y.setDate(y.getDate()-1);
  return d===td() ? "Today" : d===ym(y)+"-"+p(y.getDate()) ? "Yesterday" : new Date(d+"T00:00").toLocaleDateString("en",{weekday:"long",day:"numeric",month:"short"});
}

function post(){
  var k = V.view + V.month, fresh = k !== post.k; post.k = k;
  document.querySelectorAll(".fl").forEach(function(f){
    var w = f.style.width; f.style.width = "0";
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ f.style.width = w; }); });
  });
  if(fresh) document.querySelectorAll("[data-n]").forEach(function(el){
    var n = +el.dataset.n, t0 = performance.now();
    if(!n) return;
    (function st(ts){
      var q = Math.min(1,(ts-t0)/700);
      el.textContent = $m(n*(1-Math.pow(1-q,3)));
      if(q<1) requestAnimationFrame(st);
    })(t0);
  });
  updateSyncBadge();
}

function insCard(inc,ex,sp,rate){
  var o = [], pv = spentBy(addM(V.month,-1)), cs = Object.keys(sp).sort(function(a,b){ return sp[b]-sp[a]; });
  if(cs.length) o.push(cs[0]+" is your biggest expense, "+Math.round(sp[cs[0]]/ex*100)+"% of what you spent.");
  var m = null, mp = 0;
  cs.forEach(function(c){ if(pv[c]>0){ var q = (sp[c]-pv[c])/pv[c]; if(q>.1 && q>mp){ mp=q; m=c; } } });
  if(m) o.push("You spent "+Math.round(mp*100)+"% more on "+m+" than last month.");
  var tl=0, ts=0, n=new Date();
  Object.keys(S.budgets).forEach(function(c){ tl += S.budgets[c]; ts += sp[c]||0; });
  if(tl && V.month===ym(n)){
    var pj = ts/n.getDate()*new Date(n.getFullYear(),n.getMonth()+1,0).getDate();
    o.push(pj>tl ? "At this pace you’ll go over budget by "+$m(pj-tl)+"." : "At this pace you’ll finish "+$m(tl-pj)+" under budget.");
  }
  if(inc>0) o.push(rate<0 ? "You’ve spent more than you earned this month." : "You’re saving "+rate+"% of your income.");
  return o.length ? '<div class="card"><h2>Insights</h2>'+o.slice(0,4).map(function(s){ return'<div class="ins"><span>💡</span><span>'+e(s)+'</span></div>'; }).join("")+'</div>' : "";
}

function render(){
  var T = { overview:"Overview", tx:"Activity", budgets:"Budgets", goals:"Goals", debts:"Debts", set:"Settings" };
  var mn = ["overview","tx","budgets"].indexOf(V.view) > -1;
  document.querySelectorAll("nav button").forEach(function(b){ b.setAttribute("aria-current", b.dataset.v===V.view?"page":"false"); });
  
  $("#main").innerHTML = '<header>'+
    '<div><h1>'+T[V.view]+'</h1><small id="sync-indicator" class="mu" style="cursor:pointer" data-act="setview"></small></div>'+
    '<div class="hr">'+
      (mn ? '<div class="mn"><button data-act="pm" aria-label="Previous month">‹</button><span>'+ML(V.month)+'</span><button data-act="nm" aria-label="Next month">›</button></div>' : '')+
      (V.view==="debts" ? '<button class="btn" data-act="dnew">+ New</button>' : V.view==="goals" ? '<button class="btn" data-act="gnew">+ New goal</button>' : V.view==="set" ? '' : '<button class="btn" data-act="add">+ Add</button>')+
    '</div></header>'+
    ({ overview:vOv, tx:vTx, budgets:vBu, goals:vGo, debts:vDe, set:vSe })[V.view]();
  post();
}

function modal(t,body,ok,label){
  $("#m").innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="'+e(t)+'"><h2>'+t+'</h2>'+body+'<div class="row"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" id="mok">'+(label||"Save")+'</button></div></div>';
  $("#m").hidden = false;
  $("#mok").onclick = function(){ if(ok()!==false) closeM(); };
  var f = $("#m input,#m textarea"); if(f) f.focus();
}
function closeM(){ $("#m").hidden = true; $("#m").innerHTML = ""; }
function opts(t,sel){ return Object.keys(CATS[t]).map(function(c){ return'<option'+(c===sel?" selected":"")+'>'+c+'</option>'; }).join(""); }

function txModal(id){
  var x = S.tx.find(function(t){ return t.id==id; }) || { type:"expense", date:td() };
  modal(id?"Edit transaction":"Add transaction",
    '<div class="seg"><button data-act="mtype" data-t="expense" aria-pressed="'+(x.type==="expense")+'">Expense</button><button data-act="mtype" data-t="income" aria-pressed="'+(x.type==="income")+'">Income</button></div>'+
    '<label>Amount<input id="fa" type="number" inputmode="decimal" min="0" step="0.01" value="'+(x.amt||"")+'"></label>'+
    '<label>Category<select id="mc">'+opts(x.type,x.cat)+'</select></label>'+
    '<label>Date<input id="fd" type="date" value="'+x.date+'"></label>'+
    '<label>Note<input id="fn" maxlength="60" placeholder="Optional" value="'+e(x.note||"")+'"></label>'+
    (id ? '' : '<label class="ck"><input type="checkbox" id="fr"> Repeat every month</label>')+
    '<p class="err" id="er"></p>',
    function(){
      var t = $("#m").dataset.t || x.type, amt = parseFloat($("#fa").value), d = $("#fd").value;
      if(!(amt>0) || !d){ $("#er").textContent = "Enter an amount above 0 and pick a date."; return false; }
      var o = { type:t, amt:Math.round(amt*100)/100, cat:$("#mc").value, date:d, note:$("#fn").value.trim() };
      if(id) Object.assign(x,o);
      else {
        o.id = uid();
        if($("#fr") && $("#fr").checked){
          var r = { id:uid(), type:t, amt:o.amt, cat:o.cat, note:o.note, day:+d.slice(8), gen:d.slice(0,7) };
          S.rules.push(r); o.rid = r.id;
        }
        S.tx.push(o);
      }
      V.month = d.slice(0,7);
      persist(id?"Changes saved":"Transaction added");
    }
  );
  $("#m").dataset.t = x.type;
}

function limModal(c){
  modal("Monthly limit for "+c,'<label>Limit (0 removes it)<input id="fl" type="number" min="0" step="1" value="'+(S.budgets[c]||"")+'"></label>',function(){
    var v = parseFloat($("#fl").value)||0;
    if(v>0) S.budgets[c] = v; else delete S.budgets[c];
    persist();
  });
}

function goalModal(id){
  var g = S.goals.find(function(x){ return x.id==id; }) || {};
  modal(id?"Edit goal":"New goal",
    '<label>Name<input id="gn" maxlength="40" value="'+e(g.name||"")+'" placeholder="e.g. Emergency fund"></label><label>Target amount<input id="gt" type="number" min="1" value="'+(g.target||"")+'"></label><label>Saved so far<input id="gs" type="number" min="0" value="'+(g.saved||0)+'"></label><p class="err" id="er"></p>',
    function(){
      var n = $("#gn").value.trim(), t = parseFloat($("#gt").value), s = parseFloat($("#gs").value)||0;
      if(!n || !(t>0)){ $("#er").textContent = "Add a name and a target above 0."; return false; }
      if(id){ g.name=n; g.target=t; g.saved=s; } else S.goals.push({ id:uid(), name:n, target:t, saved:s });
      persist();
    }
  );
}

function fundModal(id){
  var g = S.goals.find(function(x){ return x.id==id; });
  modal("Add funds to "+e(g.name),'<label>Amount<input id="ga" type="number" step="1" placeholder="Use negative number to withdraw"></label>',function(){
    var was = g.saved >= g.target;
    g.saved = Math.max(0, g.saved + (parseFloat($("#ga").value)||0));
    var hit = !was && g.saved >= g.target;
    persist(hit ? "Goal reached 🎉" : "Funds updated");
    if(hit) confetti();
  },"Add");
}

function debtModal(id){
  var d = S.debts.find(function(x){ return x.id==id; }) || { kind:"owe" };
  modal(id?"Edit loan":"New loan or lending",
    '<label>Type<select id="dk"><option value="owe"'+(d.kind==="owe"?" selected":"")+'>I owe (Loan, credit card)</option><option value="lent"'+(d.kind==="lent"?" selected":"")+'>I lent (Owed to me)</option></select></label><label>Person or lender<input id="dw" maxlength="40" placeholder="e.g. Home loan, Rahul" value="'+e(d.who||"")+'"></label><label>Amount<input id="da" type="number" min="1" value="'+(d.amt||"")+'"></label><label>Interest rate, % a year (optional)<input id="dr" type="number" min="0" step="0.01" value="'+(d.rate||"")+'"></label><label>Term in months (optional)<input id="dt" type="number" min="1" value="'+(d.term||"")+'"></label><label>Next due date (optional)<input id="dd" type="date" value="'+(d.due||"")+'"></label><label>Note<input id="dn" maxlength="60" value="'+e(d.note||"")+'"></label><p class="err" id="er"></p>',
    function(){
      var w = $("#dw").value.trim(), a = parseFloat($("#da").value), rt = parseFloat($("#dr").value)||0, n = parseInt($("#dt").value)||0;
      if(!w || !(a>0)){ $("#er").textContent = "Add a name and an amount above 0."; return false; }
      var r = rt/1200, emi = n ? Math.round((r?a*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):a/n)*100)/100 : 0;
      var o = { kind:$("#dk").value, who:w, amt:a, rate:rt, term:n, emi:emi, due:$("#dd").value, note:$("#dn").value.trim() };
      if(id) Object.assign(d,o);
      else S.debts.push(Object.assign(o,{ id:uid(), paid:0, pays:[] }));
      persist();
    }
  );
}

function payModal(id){
  var d = S.debts.find(function(x){ return x.id==id; }), own = d.kind==="owe", r = rem(d), ii = own && d.rate ? Math.round(r*d.rate/1200*100)/100 : 0;
  modal(own?"Record payment":"Record repayment",
    '<label>Amount '+(own?"paid":"received")+'<input id="pa" type="number" min="0" step="0.01" value="'+(d.emi?Math.min(d.emi,Math.round((r+ii)*100)/100):"")+'"></label>'+(own?'<label>Of which interest<input id="pi" type="number" min="0" step="0.01" value="'+ii+'"></label>':'')+'<label>Date<input id="pd" type="date" value="'+td()+'"></label><p class="err" id="er"></p>',
    function(){
      var a = parseFloat($("#pa").value), i = own ? (parseFloat($("#pi").value)||0) : 0, dt = $("#pd").value;
      if(!(a>0) || i>a || !dt){ $("#er").textContent = "Enter an amount above 0 and a valid date."; return false; }
      d.paid = Math.min(d.amt, d.paid + a - i);
      d.pays.push({ date:dt, amt:a, int:i });
      if(i>0) S.tx.push({ id:uid(), type:"expense", cat:"Interest", amt:i, date:dt, note:"Interest · "+d.who });
      if(d.emi && d.due && rem(d)>0) d.due = addM(d.due.slice(0,7),1) + "-" + p(Math.min(+d.due.slice(8),28));
      var sd = rem(d) <= 0;
      persist(sd ? "Fully settled 🎉" : "Payment recorded");
      if(sd) confetti();
    }
  );
}

// ==================== EVENT LISTENERS ====================
document.addEventListener("click",function(ev){
  var el = ev.target.closest("[data-act],[data-v]");
  if(!el){ if(ev.target.id==="m") closeM(); return; }
  
  if(el.dataset.v){ V.view = el.dataset.v; render(); scrollTo(0,0); return; }
  
  var a = el.dataset.act, id = el.dataset.id;
  if(a==="pm"||a==="nm"){ V.month = addM(V.month, a==="pm"?-1:1); render(); }
  else if(a==="add") txModal();
  else if(a==="edit") txModal(id);
  else if(a==="del"){
    var rw = el.closest(".li"); if(rw) rw.classList.add("out");
    setTimeout(function(){ S.tx = S.tx.filter(function(x){ return x.id != id; }); persist("Deleted"); }, rw ? 220 : 0);
  }
  else if(a==="slice"){ V.view="tx"; V.ft="expense"; V.fc=el.dataset.c; V.q=""; render(); scrollTo(0,0); }
  else if(a==="delr"){ if(confirm("Stop recurring entry?")){ S.rules = S.rules.filter(function(r){ return r.id!=id; }); persist("Rule stopped"); } }
  else if(a==="blim") limModal(el.dataset.c);
  else if(a==="gnew") goalModal();
  else if(a==="gedit") goalModal(id);
  else if(a==="gfund") fundModal(id);
  else if(a==="gdel"){ if(confirm("Delete this goal?")){ S.goals = S.goals.filter(function(g){ return g.id!=id; }); persist(); } }
  else if(a==="dnew") debtModal();
  else if(a==="dedit") debtModal(id);
  else if(a==="dpay") payModal(id);
  else if(a==="ddel"){ if(confirm("Delete this loan entry?")){ S.debts = S.debts.filter(function(x){ return x.id!=id; }); persist(); } }
  else if(a==="close") closeM();
  else if(a==="mtype"){
    var t = el.dataset.t; $("#m").dataset.t = t;
    document.querySelectorAll(".seg button").forEach(function(b){ b.setAttribute("aria-pressed", b===el); });
    $("#mc").innerHTML = opts(t);
  }
  else if(a==="theme"){
    var dk = S.theme ? S.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    S.theme = dk ? "light" : "dark"; applyTheme(); save();
  }
  else if(a==="setview"){ V.view = "set"; render(); }
  else if(a==="login"){ loginGoogle(); }
  else if(a==="logout"){ logoutGoogle(); }
  else if(a==="export"){
    modal("Export backup",'<p class="mu">Copy this text to keep it safe.</p><textarea readonly id="ex">'+e(JSON.stringify(S))+'</textarea>',function(){
      var ta = $("#ex");
      if(navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(ta.value).then(function(){ toast("Copied to clipboard!"); });
      } else {
        ta.focus(); ta.select(); document.execCommand("copy"); toast("Copied to clipboard!");
      }
    },"Copy");
  }
  else if(a==="import"){
    modal("Import backup",'<p class="mu">Paste an exported backup JSON to restore.</p><textarea id="im"></textarea><p class="err" id="er"></p>',function(){
      try {
        var o = JSON.parse($("#im").value);
        if(!Array.isArray(o.tx)) throw 0;
        S = Object.assign({ tx:[], budgets:{}, goals:[], rules:[], debts:[], cur:"INR", theme:"" }, o);
        mk(); applyTheme(); persist("Backup restored");
      } catch(x){ $("#er").textContent = "Invalid backup format."; return false; }
    },"Import");
  }
  else if(a==="reset"){
    modal("Reset everything?",'<p class="mu">This deletes all local and synced records. This cannot be undone.</p>',function(){
      S = { tx:[], budgets:{}, goals:[], rules:[], debts:[], cur:S.cur, theme:S.theme };
      persist("All data cleared");
    },"Delete all");
  }
});

// Spotlight Hover Effect on Cards
document.addEventListener("pointermove",function(ev){
  var c = ev.target.closest && ev.target.closest(".card,.hero");
  if(!c) return;
  var r = c.getBoundingClientRect();
  c.style.setProperty("--mx", (ev.clientX - r.left) + "px");
  c.style.setProperty("--my", (ev.clientY - r.top) + "px");
});

document.addEventListener("input",function(ev){ if(ev.target.id==="q"){ V.q = ev.target.value; $("#txl").innerHTML = txList(); } });
document.addEventListener("change",function(ev){
  var t = ev.target;
  if(t.id==="ft"||t.id==="fc"){ V[t.id] = t.value; $("#txl").innerHTML = txList(); }
  else if(t.id==="cur"){ S.cur = t.value; mk(); persist(); }
});

document.addEventListener("keydown",function(ev){
  var fi = /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName), mo = !$("#m").hidden;
  if(!mo && !fi && !ev.metaKey && !ev.ctrlKey){
    if(ev.key==="n"||ev.key==="N"){ ev.preventDefault(); txModal(); return; }
    if(ev.key==="ArrowLeft"||ev.key==="ArrowRight"){ V.month = addM(V.month, ev.key==="ArrowLeft"?-1:1); render(); return; }
  }
  if(ev.key==="Escape" && mo) closeM();
  else if(ev.key==="Enter" && !$("#m").hidden && ev.target.tagName==="INPUT") $("#mok").click();
});

// App Startup
if(!LOC[S.cur]) S.cur = "INR";
mk();
applyTheme();
gen();
save();
render();
initAuth();

})();
</script>
</body>
