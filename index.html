<script>
// ==================== FIREBASE CONFIGURATION ====================
const firebaseConfig = {

let auth = null, db = null, currentUser = null, unsubSnapshot = null;
let syncStatus = "offline", lastSyncError = "";

try {
  if (firebaseConfig.apiKey) {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    try {
      db.settings({ experimentalAutoDetectLongPolling: true });

      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});

} catch(err) {

  lastSyncError = err ? (err.message || String(err)) : "Init failed";
}

// ==================== APP ENGINE ====================
(function(){
var KEY = "ledger.pro.v1";
var CATS = {
  expense: { Food:"🍽️", Fuel:"⛽", Transport:"🚗", Housing:"🏠", Family: "👨‍👩‍👧‍👦", Bills:"💡", Shopping:"🛍️", Fitness:"🏋️", Health:"💊", Donation: "🤲", Fun:"🎬", Travel:"✈️", Interest:"🏦", Other:"📦" },
  income: { Salary:"💼", Freelance:"💻", Investments:"📈", Gift:"🎁", Other:"💰" }
};
var MODES = ["UPI", "Card", "Cash", "Bank"];
var COL = ["#5b45e0","#0f9d76","#e5484d","#f5a524","#0ea5e9","#d946ef","#84cc16","#f97316","#64748b"];
var LOC = { INR:"en-IN", USD:"en-US", EUR:"de-DE", GBP:"en-GB" };

var S = { tx:[], budgets:{}, goals:[], rules:[], debts:[], cur:"INR", theme:"", updatedAt:0 };

try { Object.assign(S, JSON.parse(localStorage.getItem(KEY))); } catch(x){}

var $ = function(s){ return document.querySelector(s); };
var p = function(n){ return String(n).padStart(2,"0"); };
var uid = function(){ return Date.now() + Math.floor(Math.random()*1e4); };
var e = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var ym = function(d){ return d.getFullYear()+"-"+p(d.getMonth()+1); };
var td = function(){ var d=new Date(); return ym(d)+"-"+p(d.getDate()); };
var addM = function(m,n){ var a=m.split("-"); return ym(new Date(+a[0],+a[1]-1+n,1)); };
var ML = function(m,s){ var a=m.split("-"); return new Date(+a[0],+a[1]-1,1).toLocaleString("en",s?{month:"short"}:{month:"long",year:"numeric"}); };
var fd = function(d){ return new Date(d+"T00:00:00").toLocaleDateString("en",{day:"numeric",month:"short"}); };

var nf, V = { view:"overview", month:ym(new Date()), q:"", ft:"all", fc:"all", trendMode:"daily" };
function mk(){ nf = new Intl.NumberFormat(LOC[S.cur]||"en-IN",{ style:"currency", currency:S.cur, minimumFractionDigits:0, maximumFractionDigits:2 }); }
var $m = function(n){ return nf.format(n); };
var icon = function(t,c){ return CATS[t][c]||"📦"; };

var cloudSaveTimer = null;
var lastPushedKey = "";
var queuedSnap = null;

function num(v){ var n = +v; return isFinite(n) ? n : 0; }
function cleanStr(v, max){ return String(v==null ? "" : v).slice(0, max); }

function normalize(raw){
  raw = raw || {};
  var tx = [];
  (Array.isArray(raw.tx) ? raw.tx : []).forEach(function(x){
    if(!x) return;
    var type = x.type==="income" || x.type==="expense" ? x.type : "";
    var date = typeof x.date==="string" ? x.date.slice(0,10) : "";
    var amt = Math.round(num(x.amt)*100)/100;
    if(!type || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !(amt>0)) return;
    var row = {
      id: x.id!=null ? x.id : uid(),
      type: type,
      amt: amt,
      cat: cleanStr(x.cat||"Other", 40),
      mode: cleanStr(x.mode||"UPI", 20),
      note: cleanStr(x.note||"", 60),
      date: date
    };
    if(x.rid!=null && x.rid!=="") row.rid = x.rid;
    tx.push(row);
  });

  var budgets = {};
  if(raw.budgets && typeof raw.budgets==="object" && !Array.isArray(raw.budgets)){
    Object.keys(raw.budgets).sort().forEach(function(k){
      var v = num(raw.budgets[k]);
      if(v>0) budgets[k] = v;
    });
  }

  var goals = [];
  (Array.isArray(raw.goals) ? raw.goals : []).forEach(function(g){
    if(!g) return;
    var name = cleanStr(g.name||"", 40).trim();
    var target = num(g.target);
    if(!name || !(target>0)) return;
    goals.push({ id: g.id!=null ? g.id : uid(), name: name, target: target, saved: Math.max(0, num(g.saved)) });
  });

  var rules = [];
  (Array.isArray(raw.rules) ? raw.rules : []).forEach(function(r){
    if(!r) return;
    var type = r.type==="income" || r.type==="expense" ? r.type : "";
    var amt = Math.round(num(r.amt)*100)/100;
    var gen = typeof r.gen==="string" && /^\d{4}-\d{2}$/.test(r.gen) ? r.gen : "";
    if(!type || !(amt>0) || !gen) return;
    rules.push({
      id: r.id!=null ? r.id : uid(),
      type: type,
      amt: amt,
      cat: cleanStr(r.cat||"Other", 40),
      mode: cleanStr(r.mode||"UPI", 20),
      note: cleanStr(r.note||"", 60),
      day: Math.min(28, Math.max(1, parseInt(r.day,10)||1)),
      gen: gen
    });
  });

  var debts = [];
  (Array.isArray(raw.debts) ? raw.debts : []).forEach(function(d){
    if(!d) return;
    var who = cleanStr(d.who||"", 40).trim();
    var amt = num(d.amt);
    if(!who || !(amt>0)) return;
    var pays = [];
    (Array.isArray(d.pays) ? d.pays : []).forEach(function(p){
      if(!p || !(num(p.amt)>0) || typeof p.date!=="string") return;
      pays.push({ date: p.date.slice(0,10), amt: num(p.amt), int: Math.max(0, num(p.int)) });
    });
    debts.push({
      id: d.id!=null ? d.id : uid(),
      kind: d.kind==="lent" ? "lent" : "owe",
      who: who,
      amt: amt,
      rate: Math.max(0, num(d.rate)),
      term: Math.max(0, parseInt(d.term,10)||0),
      emi: Math.max(0, num(d.emi)),
      due: typeof d.due==="string" && /^\d{4}-\d{2}-\d{2}$/.test(d.due) ? d.due : "",
      note: cleanStr(d.note||"", 60),
      paid: Math.max(0, num(d.paid)),
      pays: pays
    });
  });

  var theme = ["light","dark","neon","amethyst","frost","ocean"].indexOf(raw.theme) > -1 ? raw.theme : "";
  return {
    tx: tx,
    budgets: budgets,
    goals: goals,
    rules: rules,
    debts: debts,
    cur: LOC[raw.cur] ? raw.cur : "INR",
    theme: theme,
    updatedAt: Math.max(0, num(raw.updatedAt))
  };
}

function stateKey(s){
  function rows(list){
    return (list||[]).map(function(x){ return JSON.stringify(x); }).sort().join("|");
  }
  var buds = Object.keys(s.budgets||{}).sort().map(function(k){ return k+":"+s.budgets[k]; }).join("|");
  return [rows(s.tx), buds, rows(s.goals), rows(s.rules), rows(s.debts), s.cur, s.theme||""].join("#");
}

function dedupeKey(x){ return x && x.rid!=null && x.rid!=="" ? ("r:"+x.rid+":"+x.date) : ("i:"+(x?x.id:"")); }
function unionList(primary, secondary, keyFn){
  var seen = {}, out = [];
  (primary||[]).concat(secondary||[]).forEach(function(item){
    if(!item) return;
    var k = keyFn(item);
    if(seen[k]) return;
    seen[k] = 1;
    out.push(item);
  });
  return out;
}

function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(x){}
}

function saveCloud(){
  if(!currentUser || !db) return;
  S = normalize(S);
  var key = S.updatedAt + ":" + stateKey(S);
  if(key === lastPushedKey){
    syncStatus = "synced";
    updateSyncBadge();
    return;
  }
  syncStatus = "syncing";
  updateSyncBadge();
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(function(){
    var payload = normalize(S);
    var sentKey = payload.updatedAt + ":" + stateKey(payload);
    db.collection("users").doc(currentUser.uid).set({
      state: payload,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true })
    .then(function(){
      lastPushedKey = sentKey;
      syncStatus = "synced";
      lastSyncError = "";
      updateSyncBadge();
      if(V.view === "set") render();
    })
    .catch(function(err){
      console.error("Cloud save failed:", err);
      lastPushedKey = "";
      syncStatus = "offline";
      lastSyncError = err ? (err.message || err.code) : "Cloud save failed";
      updateSyncBadge();
      if(V.view === "set") render();
    });
  }, 400);
}

function commit(doRender, msg){
  S.updatedAt = Date.now();
  S = normalize(S);
  saveLocal();
  saveCloud();
  if(doRender) render();
  else updateSyncBadge();
  if(msg) toast(msg);
}

function save(){ commit(false); }
function persist(msg){ commit(true, msg); }

function applyTheme(){
  if(S.theme) document.documentElement.setAttribute("data-theme",S.theme);
  else document.documentElement.removeAttribute("data-theme");
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta){
    var bg = getComputedStyle(document.documentElement).getPropertyValue("--b0").trim();
    if(bg) meta.setAttribute("content", bg);
  }
}

function updateSyncBadge(){
  var el = $("#sync-indicator");
  if(!el) return;
  if(!currentUser){
    el.innerHTML = '<span class="sync-dot"></span> Local only';
  } else if(syncStatus === "syncing"){
    el.innerHTML = '<span class="sync-dot syncing"></span> Syncing...';
  } else if(syncStatus === "synced"){
    el.innerHTML = '<span class="sync-dot on"></span> Cloud synced';
  } else {
    el.innerHTML = '<span class="sync-dot"></span> Offline';
  }
}

var inM = function(m){ return S.tx.filter(function(x){ return x.date && x.date.slice(0,7)===m; }); };
var sum = function(a,t){ return a.filter(function(x){ return x.type===t; }).reduce(function(s,x){ return s+x.amt; },0); };
function spentBy(m){ var o={}; inM(m).forEach(function(x){ if(x.type==="expense") o[x.cat]=(o[x.cat]||0)+x.amt; }); return o; }

function gen(){
  var t = td(), changed = false, have = {};
  S.tx.forEach(function(x){ if(x && x.rid!=null) have[x.rid+"@"+x.date] = 1; });
  S.rules.forEach(function(r){
    if(!r || typeof r.gen!=="string" || !/^\d{4}-\d{2}$/.test(r.gen)) return;
    var guard = 0;
    while(guard++ < 240){
      var m = addM(r.gen, 1);
      if(!/^\d{4}-\d{2}$/.test(m)) break;
      var d = m+"-"+p(Math.min(+r.day||1, 28));
      if(d > t) break;
      var k = r.id+"@"+d;
      if(!have[k]){
        S.tx.push({ id:uid()+S.tx.length, type:r.type, amt:r.amt, cat:r.cat, mode:r.mode||"UPI", note:r.note||"", date:d, rid:r.id });
        have[k] = 1;
      }
      if(r.gen !== m) changed = true;
      r.gen = m;
    }
  });
  return changed;
}

function txRow(x,act){
  var modeTag = x.mode ? ' · '+e(x.mode) : '';
  var actsHtml = act ? (
    '<div class="li-acts">'+
      '<button type="button" class="ib edit-btn" data-act="edit" data-id="'+x.id+'" aria-label="Edit transaction">✎</button>'+
      '<button type="button" class="ib del-btn" data-act="del" data-id="'+x.id+'" aria-label="Delete transaction">✕</button>'+
    '</div>'
  ) : '';
  return '<div class="li" data-id="'+x.id+'">'+
    '<span class="ic '+x.type+'">'+icon(x.type,x.cat)+'</span>'+
    '<div class="mt"><b>'+e(x.note||x.cat)+'</b><small>'+e(x.cat)+modeTag+' · '+fd(x.date)+(x.rid?' · repeats':'')+'</small></div>'+
    '<span class="am '+x.type+'">'+(x.type==="income"?"+":"−")+$m(x.amt)+'</span>'+
    actsHtml+
  '</div>';
}

function bRow(c,l,s){
  var pc = l ? s/l : 0, col = pc>1 ? "var(--ex)" : pc>=.8 ? "var(--wa)" : "var(--in)";
  return '<div class="bt"><div class="li"><span class="ic expense">'+icon("expense",c)+'</span><div class="mt"><b>'+e(c)+'</b><small>'+(l?$m(s)+' of '+$m(l):$m(s)+' spent · no limit')+'</small></div><button class="chip" data-act="blim" data-c="'+e(c)+'">'+(l?"Edit":"Set limit")+'</button></div>'+(l?'<div class="tr"><div class="fl" style="width:'+Math.min(100,pc*100)+'%;background:'+col+'"></div></div><small class="st" style="color:'+col+'">'+(pc>1?'Over by '+$m(s-l):pc===1?'Limit reached':$m(l-s)+' left')+'</small>':'')+'</div>';
}

// ==================== VIEWS ====================
function vTrend(inc, ex){
  var isDaily = V.trendMode !== "monthly";
  var header = '<div class="trend-header"><h2>Spending Trends</h2><div class="trend-tabs">'+
    '<button type="button" class="trend-tab" data-act="trend" data-m="daily" aria-pressed="'+isDaily+'">Daily Pace</button>'+
    '<button type="button" class="trend-tab" data-act="trend" data-m="monthly" aria-pressed="'+(!isDaily)+'">6 Months</button>'+
  '</div></div>';

  if(!isDaily){
    var ms = [0,1,2,3,4,5].map(function(i){ return addM(V.month,i-5); }), d = ms.map(function(m){ var t=inM(m); return[sum(t,"income"),sum(t,"expense")]; });
    var mx = Math.max.apply(null,[1].concat([].concat.apply([],d)));
    var bars = ms.map(function(m,i){
      var x = i*48+10, h1 = d[i][0]/mx*88, h2 = d[i][1]/mx*88;
      return '<rect x="'+x+'" y="'+(100-h1)+'" width="14" height="'+h1+'" rx="3" fill="var(--in)"><title>Income '+$m(d[i][0])+'</title></rect><rect x="'+(x+17)+'" y="'+(100-h2)+'" width="14" height="'+h2+'" rx="3" fill="var(--ex)"><title>Expenses '+$m(d[i][1])+'</title></rect><text x="'+(x+16)+'" y="114" text-anchor="middle">'+ML(m,1)+'</text>';
    }).join("");
    return '<div class="card">'+header+
      '<svg viewBox="0 0 300 120"><line x1="0" x2="300" y1="100" y2="100" stroke="var(--ln)"/>'+bars+'</svg>'+
      '<div class="lg" style="gap:14px;margin-top:6px"><span><i style="display:inline-block;background:var(--in);width:10px;height:10px;border-radius:3px"></i> Income</span><span><i style="display:inline-block;background:var(--ex);width:10px;height:10px;border-radius:3px"></i> Expenses</span></div></div>';
  }

  // Daily Pace curve
  var yr = +V.month.split("-")[0], mo = +V.month.split("-")[1];
  var totalDays = new Date(yr, mo, 0).getDate();
  var isCurrentMonth = V.month === ym(new Date());
  var todayDay = isCurrentMonth ? Math.min(new Date().getDate(), totalDays) : totalDays;

  var expByDay = {};
  inM(V.month).forEach(function(x){
    if(x.type==="expense"){
      var dayNum = parseInt(x.date.slice(8), 10);
      if(dayNum > 0) expByDay[dayNum] = (expByDay[dayNum]||0) + x.amt;
    }
  });

  var cumSpend = [], runTotal = 0;
  for(var day = 1; day <= totalDays; day++){
    if(day <= todayDay){
      runTotal += (expByDay[day]||0);
      cumSpend.push({ day: day, total: runTotal });
    } else {
      cumSpend.push({ day: day, total: null });
    }
  }

  var tl = 0;
  Object.keys(S.budgets).forEach(function(c){ tl += S.budgets[c]; });
  var benchmark = tl > 0 ? tl : (inc > 0 ? inc : ex);
  var maxY = Math.max(benchmark, ex, 1) * 1.15;

  var getX = function(d){ return 15 + ((d - 1) / Math.max(1, totalDays - 1)) * 270; };
  var getY = function(v){ return 95 - (Math.max(0, v) / maxY) * 80; };

  var pts = cumSpend.filter(function(d){ return d.total !== null; });
  var linePath = "", areaPath = "";
  if(pts.length > 0){
    linePath = "M " + getX(pts[0].day) + " " + getY(pts[0].total);
    areaPath = "M " + getX(pts[0].day) + " 95 L " + getX(pts[0].day) + " " + getY(pts[0].total);
    for(var i = 1; i < pts.length; i++){
      var x0 = getX(pts[i-1].day), y0 = getY(pts[i-1].total);
      var x1 = getX(pts[i].day), y1 = getY(pts[i].total);
      var cx = (x0 + x1) / 2;
      var seg = " C " + cx + " " + y0 + ", " + cx + " " + y1 + ", " + x1 + " " + y1;
      linePath += seg;
      areaPath += seg;
    }
    var last = pts[pts.length - 1];
    areaPath += " L " + getX(last.day) + " 95 Z";
  }

  var benchY = getY(benchmark);
  var benchLine = benchmark > 0 ? '<line x1="15" y1="'+benchY+'" x2="285" y2="'+benchY+'" stroke="var(--mu)" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>' : '';

  var statusText = 'Cumulative spend: <b>'+$m(ex)+'</b>' + (tl > 0 ? ' · Budget: <b>'+$m(tl)+'</b>' : '');

  var lastPt = pts.length ? pts[pts.length - 1] : null;
  var endDot = lastPt ? '<circle cx="'+getX(lastPt.day)+'" cy="'+getY(lastPt.total)+'" r="4" fill="var(--ac)" stroke="var(--sf2)" stroke-width="2"/>' : '';

  var dataStr = e(JSON.stringify({ totalDays: totalDays, todayDay: todayDay, maxY: maxY, data: cumSpend, benchmark: benchmark }));

  return '<div class="card">'+header+
    '<div class="trend-status" id="trend-status" data-default="'+e(statusText)+'">'+statusText+'</div>'+
    '<div style="position:relative">'+
      '<svg viewBox="0 0 300 120" class="daily-svg" data-info="'+dataStr+'">'+
        '<defs>'+
          '<linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">'+
            '<stop offset="0%" stop-color="var(--ac)" stop-opacity="0.38"/>'+
            '<stop offset="100%" stop-color="var(--ac)" stop-opacity="0.0"/>'+
          '</linearGradient>'+
        '</defs>'+
        '<line x1="15" x2="285" y1="95" y2="95" stroke="var(--ln)"/>'+
        benchLine+
        (areaPath ? '<path d="'+areaPath+'" fill="url(#areaGrad)"/>' : '')+
        (linePath ? '<path d="'+linePath+'" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round"/>' : '')+
        endDot+
        '<g class="chart-guide" style="display:none">'+
          '<line class="guide-line" x1="0" y1="15" x2="0" y2="95" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>'+
          '<circle class="guide-dot" cx="0" cy="0" r="4.5" fill="var(--ac)" stroke="#fff" stroke-width="2"/>'+
        '</g>'+
        '<text x="15" y="112" text-anchor="start">1st</text>'+
        '<text x="150" y="112" text-anchor="middle">15th</text>'+
        '<text x="285" y="112" text-anchor="end">'+totalDays+'th</text>'+
        '<rect class="chart-hover-hit" x="15" y="10" width="270" height="90" fill="transparent" style="cursor:crosshair"/>'+
      '</svg>'+
    '</div>'+
    '<div class="lg" style="gap:14px;margin-top:2px">'+
      '<span><i style="display:inline-block;background:var(--ac);width:10px;height:10px;border-radius:3px"></i> Actual Spend</span>'+
      (tl > 0 ? '<span><i style="display:inline-block;border-top:2px dashed var(--mu);width:14px;height:0;vertical-align:middle"></i> Budget Cap</span>' : '')+
    '</div>'+
  '</div>';
}

// ==================== AUTH & SYNC ENGINE ====================
function safePhoto(url){
  return typeof url==="string" && /^https:\/\/[^\s"'<>]+$/.test(url) ? url : "";
}

function snapData(doc){
  if(!doc) return null;
  if(doc.state) return doc;
  try { return doc.exists && typeof doc.data==="function" ? doc.data() : null; }
  catch(err){ console.error(err); return null; }
}

function consumeSnap(doc){
  var data = snapData(doc);
  if(!data || !data.state){
    saveCloud();
    syncStatus = currentUser ? "synced" : "offline";
    updateSyncBadge();
    return;
  }
  var remote = normalize(data.state);
  var local = normalize(S);
  var lt = local.updatedAt, rt = remote.updatedAt;
  var next = local, push = false;
  if(lt > rt){
    next = local;
    push = true;
  } else if(rt > lt){
    next = remote;
  } else if(stateKey(local) === stateKey(remote)){
    S = local;
    if(gen()){
      S.updatedAt = Date.now();
      S = normalize(S);
      saveLocal();
      saveCloud();
      mk(); applyTheme(); render();
    }
    syncStatus = "synced";
    updateSyncBadge();
    return;
  } else {
    next = normalize({
      tx: unionList(local.tx, remote.tx, dedupeKey),
      budgets: Object.assign({}, remote.budgets, local.budgets),
      goals: unionList(local.goals, remote.goals, function(x){ return "i:"+x.id; }),
      rules: unionList(local.rules, remote.rules, function(x){ return "i:"+x.id; }),
      debts: unionList(local.debts, remote.debts, function(x){ return "i:"+x.id; }),
      cur: local.cur || remote.cur,
      theme: local.theme || remote.theme || "",
      updatedAt: Date.now()
    });
    push = true;
  }
  var prev = stateKey(S);
  S = next;
  if(gen()){
    S.updatedAt = Date.now();
    S = normalize(S);
    push = true;
  }
  saveLocal();
  if(push) saveCloud();
  if(stateKey(S) !== prev){ mk(); applyTheme(); render(); }
  else updateSyncBadge();
}

function initAuth(){
  if (!auth) return;
  
  // 1. Capture redirect sign-in result if returning from a mobile redirect
  auth.getRedirectResult().then(function(result){
    if(result && result.user){
      currentUser = result.user;
      lastSyncError = "";
      toast("Signed in as " + (result.user.displayName || result.user.email));
      syncStatus = "syncing";
      updateSyncBadge();
      if(V.view === "set") render();
    }
  }).catch(function(err){
    if(!err || err.code==="auth/no-auth-event") return;
    console.error("Redirect sign-in notice:", err);
    handleAuthError(err);
  });

  // 2. Auth state listener
  auth.onAuthStateChanged(function(user){
    var was = currentUser && currentUser.uid;
    currentUser = user;
    if (user) {
      lastSyncError = "";
      if(was !== user.uid) toast("Signed in as " + (user.displayName || user.email));
      syncStatus = "syncing";
      updateSyncBadge();

      if (unsubSnapshot) unsubSnapshot();
      unsubSnapshot = db.collection("users").doc(user.uid).onSnapshot(function(doc){
        if(!$("#m").hidden){ queuedSnap = snapData(doc); return; }
        lastSyncError = "";
        consumeSnap(doc);
      }, function(err){
        console.error("Firestore sync error:", err);
        lastSyncError = err ? (err.message || err.code) : "Sync error";
        syncStatus = "offline";
        updateSyncBadge();
        if(V.view === "set") render();
      });

    } else {
      if (unsubSnapshot) { unsubSnapshot(); unsubSnapshot = null; }
      queuedSnap = null;
      syncStatus = "offline";
      updateSyncBadge();
      if(was) render();
    }
  });
}

function handleAuthError(err){
  var msg = (err && err.message) ? err.message : "Authentication failed";
  if(err && err.code === "auth/unauthorized-domain"){
    msg = "This domain (" + window.location.hostname + ") is not authorized in Firebase yet. Add it to Firebase Console -> Authentication -> Settings -> Authorized domains.";
  }
  lastSyncError = msg;
  syncStatus = "offline";
  updateSyncBadge();
  if(V.view === "set") render();
  alert("Sign-in notice: " + msg);
}

function loginGoogle(){
  if (!auth) return;
  var provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  lastSyncError = "";

  toast("Opening Google Sign-in…");

  // Attempt Popup first on all platforms (bypasses Mobile Safari third-party redirect storage blocking)
  auth.signInWithPopup(provider).then(function(result){
    if(result && result.user){
      currentUser = result.user;
      lastSyncError = "";
      toast("Signed in as " + (result.user.displayName || result.user.email));
      syncStatus = "syncing";
      updateSyncBadge();
      render();
    }
  }).catch(function(err){
    console.warn("Popup sign-in notice:", err);
    if(err && (err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment")){
      toast("Popup blocked, trying redirect…");
      auth.signInWithRedirect(provider).catch(function(rErr){
        console.error("Redirect sign-in failed:", rErr);
        handleAuthError(rErr);
      });
    } else if(err && err.code === "auth/unauthorized-domain"){
      handleAuthError(err);
    } else if(err && err.code !== "auth/popup-closed-by-user"){
      handleAuthError(err);
    }
  });
}

function logoutGoogle(){
  if (!auth) return;
  auth.signOut().then(function(){
    toast("Signed out");
    render();
  });
}

function haptic(type){

      else if(type==="medium") navigator.vibrate(25);
      else if(type==="danger") navigator.vibrate(45);
      else if(type==="success") navigator.vibrate([15, 30, 25]);

  }
}

function render(){
  var T = { overview:"Overview", tx:"Activity", budgets:"Budgets", goals:"Goals", debts:"Debts", set:"Settings" };
  var mn = ["overview","tx","budgets"].indexOf(V.view) > -1;
  document.querySelectorAll("nav button").forEach(function(b){ b.setAttribute("aria-current", b.dataset.v===V.view?"page":"false"); });
  
  var titleHtml = V.view === "overview"
    ? '<div><h1 style="margin:0;line-height:1.15">Money Tracker</h1><div style="display:flex;align-items:center;gap:8px;margin-top:4px"><span class="mu" style="font-size:0.84rem;font-weight:600;letter-spacing:0.02em">By Raj</span><span class="mu" style="opacity:0.4">•</span><small id="sync-indicator" class="mu" style="cursor:pointer" data-act="setview"></small></div></div>'
    : '<div><h1>'+T[V.view]+'</h1><small id="sync-indicator" class="mu" style="cursor:pointer" data-act="setview"></small></div>';

  $("#main").innerHTML = '<header>'+
    titleHtml +
    '<div class="hr">'+
      (mn ? '<div class="mn"><button data-act="pm" aria-label="Previous month">‹</button><span>'+ML(V.month)+'</span><button data-act="nm" aria-label="Next month">›</button></div>'+(V.month!==ym(new Date())?'<button class="chip" data-act="today">Today</button>':'') : '')+
      (V.view==="debts" ? '<button class="btn" data-act="dnew">+ New</button>' : V.view==="goals" ? '<button class="btn" data-act="gnew">+ New goal</button>' : V.view==="set" ? '' : '<button class="btn" data-act="add">+ Add</button>')+
    '</div></header>'+
    ({ overview:vOv, tx:vTx, budgets:vBu, goals:vGo, debts:vDe, set:vSe })[V.view]();
  post();
}

function modal(t,body,ok,label){
  haptic("medium");
  $("#m").innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="'+e(t)+'"><div class="sheet-handle" aria-hidden="true"></div><h2>'+t+'</h2>'+body+'<div class="row"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" id="mok">'+(label||"Save")+'</button></div></div>';
  $("#m").hidden = false;
  $("#mok").onclick = function(){
    var btn = $("#mok");
    if(!btn || btn.disabled) return;
    btn.disabled = true;
    var stay = false;
    try { stay = ok()===false; }
    catch(err){ stay = true; console.error(err); }
    if(stay) btn.disabled = false;
    else { haptic("success"); closeM(); }
  };
  var f = $("#m input,#m textarea"); if(f) f.focus();
}
function closeM(){
  $("#m").hidden = true;
  var s = $("#m .sheet"); if(s) s.style.transform = "";
  $("#m").innerHTML = "";
  if(queuedSnap){
    var doc = queuedSnap;
    queuedSnap = null;
    consumeSnap(doc);
  }
}
function opts(t,sel){ return Object.keys(CATS[t]).map(function(c){ return'<option'+(c===sel?" selected":"")+'>'+c+'</option>'; }).join(""); }

function txModal(id){
  var x = S.tx.find(function(t){ return t.id==id; }) || { type:"expense", date:td(), mode:"UPI" };
  modal(id?"Edit transaction":"Add transaction",
    '<div class="seg"><button data-act="mtype" data-t="expense" aria-pressed="'+(x.type==="expense")+'">Expense</button><button data-act="mtype" data-t="income" aria-pressed="'+(x.type==="income")+'">Income</button></div>'+
    '<label>Amount<input id="fa" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="'+(x.amt||"")+'"></label>'+
    '<div class="q-chips"><button type="button" class="q-chip" data-act="qamt" data-v="100">+100</button><button type="button" class="q-chip" data-act="qamt" data-v="500">+500</button><button type="button" class="q-chip" data-act="qamt" data-v="1000">+1,000</button><button type="button" class="q-chip" data-act="qamt" data-v="2000">+2,000</button></div>'+
    '<div class="g2 keep2" style="margin:0;gap:10px"><label>Category<select id="mc">'+opts(x.type,x.cat)+'</select></label>'+
    '<label>Mode<select id="mm">'+MODES.map(function(m){ return '<option'+(m===(x.mode||"UPI")?" selected":"")+'>'+m+'</option>'; }).join("")+'</select></label></div>'+
    '<label>Date<input id="fd" type="date" value="'+x.date+'"></label>'+
    '<label>Note<input id="fn" maxlength="60" placeholder="Optional description..." value="'+e(x.note||"")+'"></label>'+
    (id ? '' : '<label class="ck"><input type="checkbox" id="fr"> Repeat every month</label>')+
    '<p class="err" id="er"></p>',
    function(){
      var t = $("#m").dataset.t || x.type, amt = parseFloat($("#fa").value), d = $("#fd").value;
      if(!(amt>0) || !d){ $("#er").textContent = "Enter an amount above 0 and pick a date."; return false; }
      var o = { type:t, amt:Math.round(amt*100)/100, cat:$("#mc").value, mode:$("#mm").value, date:d, note:$("#fn").value.trim() };
      if(id) Object.assign(x,o);
      else {
        o.id = uid();
        if($("#fr") && $("#fr").checked){
          var r = { id:uid(), type:t, amt:o.amt, cat:o.cat, mode:o.mode, note:o.note, day:+d.slice(8), gen:d.slice(0,7) };
          S.rules.push(r); o.rid = r.id;
        }
        S.tx.push(o);
      }
      V.month = d.slice(0,7);
      persist(id?"Changes saved":"Transaction added");
    }
  );
  $("#m").dataset.t = x.type;
}

function limModal(c){
  modal("Monthly limit for "+c,'<label>Limit (0 removes it)<input id="fl" type="number" min="0" step="1" value="'+(S.budgets[c]||"")+'"></label>',function(){
    var v = parseFloat($("#fl").value)||0;
    if(v>0) S.budgets[c] = v; else delete S.budgets[c];
    persist();
  });
}

function goalModal(id){
  var g = S.goals.find(function(x){ return x.id==id; }) || {};
  modal(id?"Edit goal":"New goal",
    '<label>Name<input id="gn" maxlength="40" value="'+e(g.name||"")+'" placeholder="e.g. Emergency fund"></label><label>Target amount<input id="gt" type="number" min="1" value="'+(g.target||"")+'"></label><label>Saved so far<input id="gs" type="number" min="0" value="'+(g.saved||0)+'"></label><p class="err" id="er"></p>',
    function(){
      var n = $("#gn").value.trim(), t = parseFloat($("#gt").value), s = parseFloat($("#gs").value)||0;
      if(!n || !(t>0)){ $("#er").textContent = "Add a name and a target above 0."; return false; }
      if(id){ g.name=n; g.target=t; g.saved=s; } else S.goals.push({ id:uid(), name:n, target:t, saved:s });
      persist();
    }
  );
}

function fundModal(id){
  var g = S.goals.find(function(x){ return x.id==id; });
  modal("Add funds to "+e(g.name),'<label>Amount<input id="ga" type="number" step="1" placeholder="Use negative number to withdraw"></label>',function(){
    var was = g.saved >= g.target;
    g.saved = Math.max(0, g.saved + (parseFloat($("#ga").value)||0));
    var hit = !was && g.saved >= g.target;
    persist(hit ? "Goal reached 🎉" : "Funds updated");
    if(hit) confetti();
  },"Add");
}

function debtModal(id){
  var d = S.debts.find(function(x){ return x.id==id; }) || { kind:"owe" };
  modal(id?"Edit loan":"New loan or lending",
    '<label>Type<select id="dk"><option value="owe"'+(d.kind==="owe"?" selected":"")+'>I owe (Loan, credit card)</option><option value="lent"'+(d.kind==="lent"?" selected":"")+'>I lent (Owed to me)</option></select></label><label>Person or lender<input id="dw" maxlength="40" placeholder="e.g. Home loan, Friend" value="'+e(d.who||"")+'"></label><label>Amount<input id="da" type="number" min="1" value="'+(d.amt||"")+'"></label><label>Interest rate, % a year (optional)<input id="dr" type="number" min="0" step="0.01" value="'+(d.rate||"")+'"></label><label>Term in months (optional)<input id="dt" type="number" min="1" value="'+(d.term||"")+'"></label><label>Next due date (optional)<input id="dd" type="date" value="'+(d.due||"")+'"></label><label>Note<input id="dn" maxlength="60" value="'+e(d.note||"")+'"></label><p class="err" id="er"></p>',
    function(){
      var w = $("#dw").value.trim(), a = parseFloat($("#da").value), rt = parseFloat($("#dr").value)||0, n = parseInt($("#dt").value)||0;
      if(!w || !(a>0)){ $("#er").textContent = "Add a name and an amount above 0."; return false; }
      var r = rt/1200, emi = n ? Math.round((r?a*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):a/n)*100)/100 : 0;
      var o = { kind:$("#dk").value, who:w, amt:a, rate:rt, term:n, emi:emi, due:$("#dd").value, note:$("#dn").value.trim() };
      if(id) Object.assign(d,o);
      else S.debts.push(Object.assign(o,{ id:uid(), paid:0, pays:[] }));
      persist();
    }
  );
}

function payModal(id){
  var d = S.debts.find(function(x){ return x.id==id; }), own = d.kind==="owe", r = rem(d), ii = own && d.rate ? Math.round(r*d.rate/1200*100)/100 : 0;
  modal(own?"Record payment":"Record repayment",
    '<label>Amount '+(own?"paid":"received")+'<input id="pa" type="number" min="0" step="0.01" value="'+(d.emi?Math.min(d.emi,Math.round((r+ii)*100)/100):"")+'"></label>'+(own?'<label>Of which interest<input id="pi" type="number" min="0" step="0.01" value="'+ii+'"></label>':'')+'<label>Date<input id="pd" type="date" value="'+td()+'"></label><p class="err" id="er"></p>',
    function(){
      var a = parseFloat($("#pa").value), i = own ? (parseFloat($("#pi").value)||0) : 0, dt = $("#pd").value;
      if(!(a>0) || i>a || !dt){ $("#er").textContent = "Enter an amount above 0 and a valid date."; return false; }
      d.paid = Math.min(d.amt, d.paid + a - i);
      d.pays.push({ date:dt, amt:a, int:i });
      if(i>0) S.tx.push({ id:uid(), type:"expense", cat:"Interest", amt:i, date:dt, note:"Interest · "+d.who });
      if(d.emi && d.due && rem(d)>0) d.due = addM(d.due.slice(0,7),1) + "-" + p(Math.min(+d.due.slice(8),28));
      var sd = rem(d) <= 0;
      persist(sd ? "Fully settled 🎉" : "Payment recorded");
      if(sd) confetti();
    }
  );
}

function exportCSV(){
  if(!S.tx.length){ toast("No transactions to export"); return; }
  var rows = ["Date,Type,Category,Mode,Amount,Note"];
  S.tx.slice().sort(function(a,b){ return b.date.localeCompare(a.date); }).forEach(function(x){
    rows.push([x.date, x.type, '"'+x.cat+'"', '"'+(x.mode||"UPI")+'"', x.amt, '"'+(x.note||"").replace(/"/g,'""')+'"'].join(","));
  });
  var blob = new Blob(["\uFEFF" + rows.join("\n")], { type:"text/csv;charset=utf-8;" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Ledger-Transactions-"+td()+".csv";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  toast("CSV downloaded!");
}

function scrollMainToTop(){
  var m = $("#main");
  if(m){
    if(m.scrollTo) m.scrollTo({ top: 0, behavior: "instant" });
    else m.scrollTop = 0;
  }
  window.scrollTo(0, 0);
}

// ==================== EVENT LISTENERS ====================
document.addEventListener("click",function(ev){
  var el = ev.target.closest("[data-act],[data-v]");
  if(!el){ if(ev.target.id==="m") closeM(); return; }
  
  if(el.dataset.v && !el.dataset.act){
    if(V.view !== el.dataset.v){
      V.view = el.dataset.v;
      render();
      scrollMainToTop();
    }
    return;
  }
  
  var a = el.dataset.act, id = el.dataset.id;
  if(a==="pm"||a==="nm"){ V.month = addM(V.month, a==="pm"?-1:1); render(); }
  else if(a==="today"){ V.month = ym(new Date()); render(); }
  else if(a==="add") txModal();
  else if(a==="edit") txModal(id);
  else if(a==="qamt"){
    haptic("light");
    var inp = $("#fa");
    if(inp) inp.value = (parseFloat(inp.value)||0) + (+el.dataset.v);
  }
  else if(a==="del"){
    haptic("danger");
    var rw = el.closest(".swipe-wrap, .li"); if(rw) rw.classList.add("out");
    setTimeout(function(){ S.tx = S.tx.filter(function(x){ return x.id != id; }); persist("Deleted"); }, rw ? 220 : 0);
  }
  else if(a==="slice"){ V.view="tx"; V.ft="expense"; V.fc=el.dataset.c; V.q=""; render(); scrollMainToTop(); }
  else if(a==="trend"){ V.trendMode = el.dataset.m; render(); }
  else if(a==="delr"){ if(confirm("Stop recurring entry?")){ S.rules = S.rules.filter(function(r){ return r.id!=id; }); persist("Rule stopped"); } }
  else if(a==="blim") limModal(el.dataset.c);
  else if(a==="gnew") goalModal();
  else if(a==="gedit") goalModal(id);
  else if(a==="gfund") fundModal(id);
  else if(a==="gdel"){ if(confirm("Delete this goal?")){ S.goals = S.goals.filter(function(g){ return g.id!=id; }); persist(); } }
  else if(a==="dnew") debtModal();
  else if(a==="dedit") debtModal(id);
  else if(a==="dpay") payModal(id);
  else if(a==="ddel"){ if(confirm("Delete this loan entry?")){ S.debts = S.debts.filter(function(x){ return x.id!=id; }); persist(); } }
  else if(a==="close") closeM();
  else if(a==="mtype"){
    var t = el.dataset.t; $("#m").dataset.t = t;
    document.querySelectorAll(".seg button").forEach(function(b){ b.setAttribute("aria-pressed", b===el); });
    $("#mc").innerHTML = opts(t);
  }
  else if(a==="theme"){
    var dk = S.theme ? S.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    S.theme = dk ? "light" : "dark"; applyTheme(); save();
  }
  else if(a==="setview"){ if(V.view!=="set"){ V.view = "set"; render(); scrollMainToTop(); } }
  else if(a==="login"){ loginGoogle(); }
  else if(a==="logout"){ logoutGoogle(); }
  else if(a==="syncnow"){
    haptic("light");
    toast("Syncing with cloud…");
    lastPushedKey = "";
    saveCloud();
  }
  else if(a==="csv"){ exportCSV(); }
  else if(a==="export"){
    modal("Export backup",'<p class="mu">Copy this text to keep it safe.</p><textarea readonly id="ex">'+e(JSON.stringify(S))+'</textarea>',function(){
      var ta = $("#ex");
      if(navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(ta.value).then(function(){ toast("Copied to clipboard!"); });
      } else {
        ta.focus(); ta.select(); document.execCommand("copy"); toast("Copied to clipboard!");
      }
    },"Copy");
  }
  else if(a==="import"){
    modal("Import backup",'<p class="mu">Paste an exported backup JSON to restore.</p><textarea id="im"></textarea><p class="err" id="er"></p>',function(){
      try {
        var o = JSON.parse($("#im").value);
        if(!o || typeof o !== "object" || !Array.isArray(o.tx)) throw 0;
        S = normalize(o);
        mk(); applyTheme(); persist("Backup restored");
      } catch(x){ $("#er").textContent = "Invalid backup format."; return false; }
    },"Import");
  }
  else if(a==="reset"){
    modal("Reset everything?",'<p class="mu">This deletes all local and synced records. This cannot be undone.</p>',function(){
      S = { tx:[], budgets:{}, goals:[], rules:[], debts:[], cur:S.cur, theme:S.theme };
      persist("All data cleared");
    },"Delete all");
  }
});

// Spotlight Hover Effect on Cards, Chart Crosshair & 3D Wallet Tilt
document.addEventListener("pointermove",function(ev){
  var c = ev.target.closest && ev.target.closest(".card,.hero");
  if(c){
    var r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (ev.clientX - r.left) + "px");
    c.style.setProperty("--my", (ev.clientY - r.top) + "px");
  }

  var wc = ev.target.closest && ev.target.closest(".wallet-card");
  if(wc){
    var wr = wc.getBoundingClientRect();
    var px = (ev.clientX - wr.left) / wr.width - 0.5;
    var py = (ev.clientY - wr.top) / wr.height - 0.5;
    wc.style.transform = "perspective(900px) rotateY(" + (px * 14).toFixed(2) + "deg) rotateX(" + (-py * 14).toFixed(2) + "deg) translateY(-3px)";
    wc.style.setProperty("--mx", (ev.clientX - wr.left) + "px");
    wc.style.setProperty("--my", (ev.clientY - wr.top) + "px");
  } else {
    var allW = document.querySelectorAll(".wallet-card");
    if(allW.length && allW[0].style.transform && allW[0].style.transform !== "none"){
      allW.forEach(function(el){ el.style.transform = "perspective(900px) rotateY(0deg) rotateX(0deg) translateY(0)"; });
    }
  }

  var hit = ev.target.closest && ev.target.closest(".chart-hover-hit");
  if(hit){
    trackChart(hit, ev.clientX);
  } else {
    resetChart();
  }
});

function trackChart(hit, clientX){
  var svg = hit.closest("svg");
  if(!svg) return;
  var raw = svg.dataset.info;
  if(!raw) return;
  try {
    var info = JSON.parse(raw);
    var rect = hit.getBoundingClientRect();
    var xRatio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    var hoverDay = Math.round(1 + xRatio * (info.totalDays - 1));
    hoverDay = Math.max(1, Math.min(info.totalDays, hoverDay));
    
    var guide = svg.querySelector(".chart-guide");
    var guideLine = svg.querySelector(".guide-line");
    var guideDot = svg.querySelector(".guide-dot");
    var statusEl = document.getElementById("trend-status");

    var dItem = info.data[hoverDay - 1];
    var hasData = dItem && dItem.total !== null;

    var svgX = 15 + ((hoverDay - 1) / Math.max(1, info.totalDays - 1)) * 270;
    var val = hasData ? dItem.total : 0;
    var svgY = 95 - (val / info.maxY) * 80;

    if(guide && guideLine && guideDot){
      guide.style.display = "block";
      guideLine.setAttribute("x1", svgX);
      guideLine.setAttribute("x2", svgX);
      if(hasData){
        guideDot.style.display = "block";
        guideDot.setAttribute("cx", svgX);
        guideDot.setAttribute("cy", svgY);
      } else {
        guideDot.style.display = "none";
      }
    }

    if(statusEl){
      if(hasData){
        statusEl.innerHTML = '<b>Day '+hoverDay+' ('+ML(V.month,1)+'):</b> '+$m(val)+' spent';
      } else {
        statusEl.innerHTML = '<b>Day '+hoverDay+':</b> Future date';
      }
    }
  } catch(err){}
}

function resetChart(){
  var openGuides = document.querySelectorAll(".chart-guide");
  openGuides.forEach(function(g){ g.style.display = "none"; });
  var statusEl = document.getElementById("trend-status");
  if(statusEl && statusEl.dataset.default){
    statusEl.innerHTML = statusEl.dataset.default;
  }
}

document.addEventListener("input",function(ev){ if(ev.target.id==="q"){ V.q = ev.target.value; $("#txl").innerHTML = txList(); } });
document.addEventListener("change",function(ev){
  var t = ev.target;
  if(t.id==="ft"||t.id==="fc"){ V[t.id] = t.value; $("#txl").innerHTML = txList(); }
  else if(t.id==="cur"){ S.cur = t.value; mk(); persist(); }
  else if(t.id==="theme-select"){
    S.theme = t.value;
    applyTheme();
    save();
    toast("Theme updated!");
  }
});

document.addEventListener("keydown",function(ev){
  var fi = /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName), mo = !$("#m").hidden;
  if(!mo && !fi && !ev.metaKey && !ev.ctrlKey){
    if(ev.key==="n"||ev.key==="N"){ ev.preventDefault(); txModal(); return; }
    if(ev.key==="ArrowLeft"||ev.key==="ArrowRight"){ V.month = addM(V.month, ev.key==="ArrowLeft"?-1:1); render(); return; }
  }
  if(ev.key==="Escape" && mo) closeM();
  else if(ev.key==="Enter" && !$("#m").hidden && ev.target.tagName==="INPUT") $("#mok").click();
});

// ==================== TACTILE GESTURES & TOUCH ENGINE ====================

// 1. Mobile Touch Tracking on SVG Chart
document.addEventListener("touchmove", function(ev){
  var hit = ev.target.closest && ev.target.closest(".chart-hover-hit");
  if(hit){
    var t = ev.touches && ev.touches[0];
    if(t){
      ev.preventDefault();
      trackChart(hit, t.clientX);
    }
  }
}, { passive:false });

document.addEventListener("touchstart", function(ev){
  var hit = ev.target.closest && ev.target.closest(".chart-hover-hit");
  if(hit){
    var t = ev.touches && ev.touches[0];
    if(t) trackChart(hit, t.clientX);
  }
}, { passive:true });

document.addEventListener("touchend", function(ev){
  var hit = ev.target.closest && ev.target.closest(".chart-hover-hit");
  if(hit) resetChart();
}, { passive:true });

// 2. Sliding Tab Picker on Bottom Navigation Dock
var navSliding = false;
function pickNavFromPoint(x, y){
  var el = document.elementFromPoint(x, y);
  var btn = el && el.closest("#nav button[data-v]");
  if(btn && btn.dataset.v && btn.dataset.v !== V.view){
    V.view = btn.dataset.v;
    haptic("light");
    render();
    scrollMainToTop();
  }
}

document.addEventListener("touchstart", function(ev){
  var nav = ev.target.closest && ev.target.closest("#nav");
  if(nav){
    navSliding = true;
    var t = ev.touches && ev.touches[0];
    if(t) pickNavFromPoint(t.clientX, t.clientY);
  }
}, { passive:true });

document.addEventListener("touchmove", function(ev){
  if(navSliding){
    var t = ev.touches && ev.touches[0];
    if(t) pickNavFromPoint(t.clientX, t.clientY);
  }
}, { passive:true });

document.addEventListener("touchend", function(){
  navSliding = false;
}, { passive:true });

// 3. Bottom Sheet Pull-down on Mobile
var sheetDrag = null;
document.addEventListener("touchstart", function(ev){
  var handle = ev.target.closest && ev.target.closest(".sheet-handle, .sheet > h2");
  var sheet = $("#m:not([hidden]) .sheet");
  if(handle && sheet){
    var st = ev.changedTouches && ev.changedTouches[0];
    if(st){
      sheetDrag = { sheet: sheet, startY: st.clientY, dy: 0 };
      sheet.style.transition = "none";
    }
  }
}, { passive:true });

document.addEventListener("touchmove", function(ev){
  if(!sheetDrag) return;
  var t = ev.changedTouches && ev.changedTouches[0];
  if(!t) return;
  var sdy = t.clientY - sheetDrag.startY;
  if(sdy > 0){
    sheetDrag.dy = sdy;
    sheetDrag.sheet.style.transform = "translateY(" + sdy + "px)";
  }
}, { passive:true });

document.addEventListener("touchend", function(){
  if(!sheetDrag) return;
  var s = sheetDrag.sheet;
  var sdy = sheetDrag.dy;
  sheetDrag = null;
  s.style.transition = "transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)";
  if(sdy > 75){
    s.style.transform = "translateY(100%)";
    haptic("light");
    setTimeout(closeM, 200);
  } else {
    s.style.transform = "";
  }
}, { passive:true });

// 4. Unified Slide for Month (Touch on mobile, Mouse drag on desktop)
var slideStart = null;
function startSlide(x, y, target){
  if(target.closest && target.closest("input,textarea,select,button,a,#nav,#m,.daily-svg,.li-acts,.wallet-card")){
    slideStart = null;
    return;
  }
  slideStart = { x: x, y: y, dx: 0, dy: 0 };
}
function moveSlide(x, y){
  if(!slideStart) return;
  slideStart.dx = x - slideStart.x;
  slideStart.dy = y - slideStart.y;
}
function endSlide(){
  if(!slideStart) return;
  var dx = slideStart.dx, dy = slideStart.dy;
  slideStart = null;
  if(!$("#m").hidden) return;
  if(["overview","tx","budgets"].indexOf(V.view) < 0) return;
  if(Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.3){
    haptic("light");
    V.month = addM(V.month, dx > 0 ? -1 : 1);
    render();
  }
}

document.addEventListener("touchstart", function(ev){
  var t = ev.touches && ev.touches[0];
  if(t) startSlide(t.clientX, t.clientY, ev.target);
}, { passive:true });

document.addEventListener("touchmove", function(ev){
  var t = ev.touches && ev.touches[0];
  if(t) moveSlide(t.clientX, t.clientY);
}, { passive:true });

document.addEventListener("touchend", endSlide, { passive:true });

document.addEventListener("mousedown", function(ev){
  if(ev.button === 0) startSlide(ev.clientX, ev.clientY, ev.target);
});
document.addEventListener("mousemove", function(ev){
  if(slideStart) moveSlide(ev.clientX, ev.clientY);
});
document.addEventListener("mouseup", endSlide);

// App Startup
S = normalize(S);
mk();
applyTheme();
gen();
saveLocal();
render();
initAuth();

})();
</script>
